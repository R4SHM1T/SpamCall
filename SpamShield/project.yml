name: SpamShield
options:
  bundleIdPrefix: com.spamshield.personal
targets:
  SpamShield:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - App
      - Shared
      - CallBlocker/blocklist.txt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spamshield.personal.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Spam Shield
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: CallBlocker
        embed: true
  CallBlocker:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - CallBlocker
      - Shared
    info:
      path: CallBlocker/Info.plist
      properties:
        CFBundleDisplayName: Spam Shield Blocker
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spamshield.personal.app.blocker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
