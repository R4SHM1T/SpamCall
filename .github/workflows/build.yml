name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project SpamShield.xcodeproj -scheme SpamShield \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SpamShield.app Payload/
          zip -r SpamShield.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SpamShield-ipa
          path: SpamShield.ipa
